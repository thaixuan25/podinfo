name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Kiem tra code
        run: go vet ./...
      - name: Chay unit test
        run: go test ./...

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.prep.outputs.image }}
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Dat ten va tag cho image
        id: prep
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/podinfo" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build va day image len GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: REVISION=${{ github.sha }}
          tags: ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}